name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish (for a failed publishing retry)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    environment: maven-central
    env:
      RELEASE_TAG: ${{ inputs.release_tag || needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          submodules: recursive

      - name: Verify release tag and version
        shell: bash
        run: |
          version=$(sed -n 's/^sdk.version=//p' gradle.properties)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          [[ "$version" != *-SNAPSHOT ]]
          test "$RELEASE_TAG" = "v$version"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor HEAD origin/main
          python3 -c 'import json, os; assert json.load(open(".release-please-manifest.json"))["."] == os.environ["RELEASE_TAG"][1:]'

      - name: Set up JDK
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Install Android release SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Verify both SDKs
        run: ./gradlew :altertable:test :altertable-android:testReleaseUnitTest

      - name: Check publishing credentials
        shell: bash
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          for name in MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD SIGNING_KEY SIGNING_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing maven-central secret: $name"
              exit 1
            fi
          done

      - name: Publish both SDKs to Maven Central
        run: ./gradlew :altertable:publishAndReleaseToMavenCentral :altertable-android:publishAndReleaseToMavenCentral
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
